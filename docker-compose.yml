services:
  reportes:
    build: .
    image: tonovarela/reportes-ventas:latest
    volumes:
      - ./entrada:/data/entrada:ro
      - ./salida:/data/salida
    environment:
      BASE_URL: ${BASE_URL:-}
      DIRECCION_CORREO: ${DIRECCION_CORREO:-}
      TOKEN_SECRETO: ${TOKEN_SECRETO:?Falta TOKEN_SECRETO en .env}

  # saca el Excel de la semana desde SQL Server y lo deja en ./entrada
  extraer:
    build: .
    image: tonovarela/reportes-ventas:latest
    entrypoint: ["python", "/app/extraer_excel.py"]
    command: []
    volumes:
      - ./entrada:/data/entrada
    environment:
      ENTRADA: /data/entrada
      SQL_SERVIDOR: ${SQL_SERVIDOR:-}
      SQL_PUERTO: ${SQL_PUERTO:-1433}
      SQL_BASE_DATOS: ${SQL_BASE_DATOS:-}
      SQL_USUARIO: ${SQL_USUARIO:-}
      SQL_CONTRASENA: ${SQL_CONTRASENA:-}
      SQL_TIMEOUT: ${SQL_TIMEOUT:-600}

  # panel web: ejecuta el proceso, muestra el historial, manda los correos y publica /reportes/
  # El panel solo responde a ADMIN_REDES; /reportes/<año>/<semana>/<token>/ es público.
  web:
    build: .
    image: tonovarela/reportes-ventas:latest
    entrypoint: ["uvicorn", "web.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    command: []
    ports:
      - "8888:8000"
    volumes:
      - ./entrada:/data/entrada
      - ./salida:/data/salida
    env_file: .env
    environment:
      ENTRADA: /data/entrada
      SALIDA: /data/salida
      FOLDER_SQL: /app/sql
